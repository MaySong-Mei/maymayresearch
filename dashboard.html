<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research Thesis Tree — live (Supabase Realtime)</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
         color: #0f172a; background: #f8fafc; }
  header.top { padding: 16px 24px; background: white; border-bottom: 1px solid #e2e8f0;
               display: flex; align-items: center; gap: 16px; }
  header.top h1 { margin: 0; font-size: 17px; }
  header.top .meta { color: #64748b; font-size: 12px; }
  header.top input { padding: 4px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
  .status-pill { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-family: monospace; }
  .status-pill.connected { background: #dcfce7; color: #166534; }
  .status-pill.connecting { background: #fef3c7; color: #92400e; }
  .status-pill.error { background: #fee2e2; color: #991b1b; }
  .legend { display: flex; gap: 24px; padding: 8px 24px; background: white; border-bottom: 1px solid #e2e8f0; font-size: 12px; flex-wrap: wrap; }
  .legend-item { display: inline-flex; align-items: center; gap: 4px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend .badge-static { display: inline-flex; width: 18px; height: 18px; border-radius: 50%;
                          background: #1e293b; color: white; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; }
  main { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr); }
  .tree-pane { padding: 24px; overflow: auto; border-right: 1px solid #e2e8f0; background: white; min-height: calc(100vh - 110px); }
  .panel-pane { padding: 24px; overflow: auto; max-height: calc(100vh - 110px); }
  svg.thesis-tree .node { cursor: pointer; transition: filter 0.2s; }
  svg.thesis-tree .node:hover circle { stroke: #2563eb; stroke-width: 3; }
  svg.thesis-tree .node.flash circle { animation: flash 1.4s; }
  @keyframes flash { 0% { filter: drop-shadow(0 0 0 #2563eb); } 50% { filter: drop-shadow(0 0 12px #2563eb); } 100% { filter: drop-shadow(0 0 0 #2563eb); } }
  .node-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 12px; overflow: hidden; transition: box-shadow 0.15s; }
  .node-card.focused { box-shadow: 0 0 0 3px #2563eb; }
  .node-card header { padding: 10px 14px; background: #f1f5f9; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; }
  .node-card .badge { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: #1e293b; color: white; align-items: center; justify-content: center; font-weight: 700; }
  .node-card .short { font-family: monospace; color: #475569; }
  .node-card .type { font-weight: 600; }
  .node-card .status { color: #64748b; }
  .branch-pill { background: #1e293b; color: white; padding: 2px 8px; border-radius: 10px; font-family: monospace; font-size: 11px; }
  .node-card .claim, .node-card .prediction, .node-card .evidence, .node-card .review {
    padding: 8px 14px; font-size: 13px; line-height: 1.5; border-top: 1px solid #f1f5f9; }
  .review { background: #fef3c7; }
  .review ul { margin: 4px 0 0; padding-left: 20px; }
  .empty { padding: 40px; color: #64748b; text-align: center; }
</style>
</head>
<body>
<header class="top">
  <h1>Research Thesis Tree</h1>
  <span id="meta" class="meta">—</span>
  <span id="status" class="status-pill connecting">connecting…</span>
  <span style="flex: 1;"></span>
  <label class="meta">repo: <input id="repo-input" value=""></label>
</header>
<div class="legend">
  <div class="legend-item"><b>Branching:</b></div>
  <span class="legend-item"><span class="dot" style="background:#6b7280"></span>root</span>
  <span class="legend-item"><span class="dot" style="background:#3b82f6"></span>narrow</span>
  <span class="legend-item"><span class="dot" style="background:#f59e0b"></span>rigor</span>
  <span class="legend-item"><span class="dot" style="background:#a855f7"></span>reframe</span>
  <span class="legend-item"><span class="dot" style="background:#ec4899"></span>pivot</span>
  <span class="legend-item"><span class="dot" style="background:#10b981"></span>synthesis</span>
  <span style="border-left: 1px solid #e2e8f0; height: 16px;"></span>
  <div class="legend-item"><b>Status:</b></div>
  <span class="legend-item"><span class="badge-static">·</span>pending</span>
  <span class="legend-item"><span class="badge-static">✓</span>supported</span>
  <span class="legend-item"><span class="badge-static">?</span>not-detected</span>
  <span class="legend-item"><span class="badge-static">✗</span>refuted</span>
  <span class="legend-item"><span class="badge-static">⊓</span>ceiling-bound</span>
  <span class="legend-item"><span class="badge-static">∅</span>exhausted</span>
</div>
<main>
  <section class="tree-pane" id="tree-pane"><div class="empty">loading…</div></section>
  <section class="panel-pane" id="panel-pane"></section>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ── config ────────────────────────────────────────────────────────────────
const CONFIG_URL_PARAM = new URLSearchParams(location.search);
const SUPABASE_URL = CONFIG_URL_PARAM.get("url") || window.SUPABASE_URL || "__SUPABASE_URL__";
const SUPABASE_ANON_KEY = CONFIG_URL_PARAM.get("key") || window.SUPABASE_ANON_KEY || "__SUPABASE_ANON_KEY__";
const REPO_SLUG = CONFIG_URL_PARAM.get("repo") || window.REPO_SLUG || "agent_demo";

document.getElementById("repo-input").value = REPO_SLUG;
document.getElementById("repo-input").addEventListener("change", (e) => {
  const u = new URL(location.href);
  u.searchParams.set("repo", e.target.value);
  location.href = u.toString();
});

const supa = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  realtime: { params: { eventsPerSecond: 5 } },
});

// ── colors ────────────────────────────────────────────────────────────────
const NODE_COLORS = {
  root: "#6b7280", narrow: "#3b82f6", rigor: "#f59e0b",
  reframe: "#a855f7", pivot: "#ec4899", synthesis: "#10b981",
  unknown: "#9ca3af",
};
const STATUS_BADGES = {
  pending: "·", supported: "✓", "not-detected": "?",
  refuted: "✗", "ceiling-bound": "⊓", exhausted: "∅",
};

// ── state ─────────────────────────────────────────────────────────────────
let nodes = [];        // sorted by committed_at asc (topo-ish)
let branches = [];
let lastFlashSha = null;

function setStatus(text, cls) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status-pill " + cls;
}

function setMeta(n, b) {
  document.getElementById("meta").textContent =
    `${n} nodes · ${b} branches · live`;
}

// ── topo layout (parents-before-children) ─────────────────────────────────
function topoSort(rows) {
  const bySha = Object.fromEntries(rows.map(r => [r.sha, r]));
  const out = [];
  const visited = new Set();
  function visit(sha) {
    if (visited.has(sha)) return;
    visited.add(sha);
    const n = bySha[sha];
    if (!n) return;
    for (const p of (n.parents || [])) visit(p);
    out.push(n);
  }
  // Stable order: sort root-roots by committed_at
  const sorted = [...rows].sort((a, b) =>
    (a.committed_at || "").localeCompare(b.committed_at || ""));
  for (const r of sorted) visit(r.sha);
  return out;
}

function computeLayout(ordered) {
  const depth = {};
  const lane = {};
  let nextLane = 0;
  for (const n of ordered) {
    if (!n.parents || n.parents.length === 0) {
      depth[n.sha] = 0;
    } else {
      const ds = n.parents.map(p => depth[p]).filter(x => x !== undefined);
      depth[n.sha] = (ds.length ? Math.max(...ds) : 0) + 1;
    }
    if (!n.parents || n.parents.length === 0) {
      lane[n.sha] = 0; nextLane = Math.max(nextLane, 1);
    } else if (["rigor", "reframe", "pivot", "synthesis"].includes(n.type)) {
      lane[n.sha] = nextLane++;
    } else {
      lane[n.sha] = lane[n.parents[0]] ?? 0;
    }
  }
  return { depth, lane };
}

const ROW_H = 80, LANE_W = 140, MARGIN_X = 50, MARGIN_Y = 50, RADIUS = 16;
function coord(d, l) { return [MARGIN_X + l * LANE_W, MARGIN_Y + d * ROW_H]; }

function escapeXml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderSvg(ordered) {
  if (!ordered.length) return '<div class="empty">empty repo</div>';
  const { depth, lane } = computeLayout(ordered);
  const maxD = Math.max(...Object.values(depth));
  const maxL = Math.max(...Object.values(lane));
  const w = MARGIN_X * 2 + maxL * LANE_W;
  const h = MARGIN_Y * 2 + maxD * ROW_H;
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" class="thesis-tree" xmlns="http://www.w3.org/2000/svg">`;
  for (const n of ordered) {
    const [x2, y2] = coord(depth[n.sha], lane[n.sha]);
    for (const p of (n.parents || [])) {
      if (depth[p] === undefined) continue;
      const [x1, y1] = coord(depth[p], lane[p]);
      if (x1 === x2) {
        svg += `<path d="M ${x1} ${y1} L ${x2} ${y2}" stroke="#cbd5e1" stroke-width="2" fill="none"/>`;
      } else {
        const my = y1 + (y2 - y1) * 0.5;
        svg += `<path d="M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}" stroke="#cbd5e1" stroke-width="2" fill="none"/>`;
      }
    }
  }
  for (const n of ordered) {
    const [x, y] = coord(depth[n.sha], lane[n.sha]);
    const t = n.type || "unknown";
    const color = NODE_COLORS[t] || NODE_COLORS.unknown;
    const badge = STATUS_BADGES[n.status] || "·";
    const flash = (n.sha === lastFlashSha) ? " flash" : "";
    const claim = (n.claim || "").slice(0, 40) + ((n.claim || "").length > 40 ? "…" : "");
    svg += `<g class="node${flash}" data-sha="${n.short || n.sha.slice(0,7)}" onclick="window.__focus('${n.short || n.sha.slice(0,7)}')">
      <circle cx="${x}" cy="${y}" r="${RADIUS}" fill="${color}" stroke="#1e293b" stroke-width="2"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="white">${escapeXml(badge)}</text>
      <text x="${x+RADIUS+8}" y="${y-4}" font-size="11" fill="#475569" font-family="monospace">${escapeXml(n.short || n.sha.slice(0,7))} · ${escapeXml(t)}</text>
      <text x="${x+RADIUS+8}" y="${y+10}" font-size="12" fill="#0f172a">${escapeXml(claim)}</text>
    </g>`;
  }
  svg += "</svg>";
  return svg;
}

function renderPanel(ordered, branchTips) {
  const tipsBySha = {};
  for (const b of branchTips) {
    (tipsBySha[b.tip_sha] ||= []).push(b.name);
  }
  return ordered.map(n => {
    const t = n.type || "unknown";
    const color = NODE_COLORS[t] || NODE_COLORS.unknown;
    const badge = STATUS_BADGES[n.status] || "·";
    const branches = (tipsBySha[n.sha] || [])
      .map(b => `<span class="branch-pill">${escapeXml(b)}</span>`).join("");
    const reviews = (n.review_comments || []).length
      ? `<div class="review"><b>Review</b><ul>${(n.review_comments||[]).map(c => `<li>${escapeXml(c)}</li>`).join("")}</ul></div>`
      : "";
    const short = n.short || n.sha.slice(0, 7);
    return `<article id="node-${short}" class="node-card">
      <header style="border-left:6px solid ${color}">
        <span class="badge">${escapeXml(badge)}</span>
        <span class="short">${short}</span>
        <span class="type">${escapeXml(t)}</span>
        <span class="status">${escapeXml(n.status || "")}</span>
        ${branches}
      </header>
      <div class="claim"><b>Claim:</b> ${escapeXml(n.claim || "")}</div>
      <div class="prediction"><b>Prediction:</b> ${escapeXml(n.prediction || "—")}</div>
      <div class="evidence"><b>Evidence:</b> ${escapeXml(n.evidence || "—")}</div>
      ${reviews}
    </article>`;
  }).join("");
}

window.__focus = function(short) {
  document.querySelectorAll(".node-card.focused").forEach(e => e.classList.remove("focused"));
  const el = document.getElementById("node-" + short);
  if (el) { el.classList.add("focused"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
};

function rerender() {
  const ordered = topoSort(nodes);
  document.getElementById("tree-pane").innerHTML = renderSvg(ordered);
  document.getElementById("panel-pane").innerHTML = renderPanel(ordered, branches);
  setMeta(nodes.length, branches.length);
}

// ── data sync ─────────────────────────────────────────────────────────────
async function fetchAll() {
  const [n, b] = await Promise.all([
    supa.from("nodes").select("*").eq("repo", REPO_SLUG).order("committed_at", { ascending: true }),
    supa.from("branches").select("*").eq("repo", REPO_SLUG),
  ]);
  if (n.error) throw n.error;
  if (b.error) throw b.error;
  nodes = n.data || [];
  branches = b.data || [];
}

function applyNodeChange(payload) {
  if (payload.new && payload.new.repo !== REPO_SLUG) return;
  if (payload.old && payload.old.repo !== REPO_SLUG && !payload.new) return;
  const sha = (payload.new && payload.new.sha) || (payload.old && payload.old.sha);
  if (payload.eventType === "DELETE") {
    nodes = nodes.filter(n => n.sha !== sha);
  } else {
    const idx = nodes.findIndex(n => n.sha === sha);
    if (idx >= 0) nodes[idx] = payload.new;
    else nodes.push(payload.new);
    lastFlashSha = sha;
  }
  rerender();
}

function applyBranchChange(payload) {
  if (payload.new && payload.new.repo !== REPO_SLUG) return;
  const name = (payload.new && payload.new.name) || (payload.old && payload.old.name);
  if (payload.eventType === "DELETE") {
    branches = branches.filter(b => b.name !== name);
  } else {
    const idx = branches.findIndex(b => b.name === name);
    if (idx >= 0) branches[idx] = payload.new;
    else branches.push(payload.new);
  }
  rerender();
}

async function start() {
  try {
    setStatus("loading rows…", "connecting");
    await fetchAll();
    rerender();

    setStatus("subscribing…", "connecting");
    const channel = supa.channel(`research:${REPO_SLUG}`)
      .on("postgres_changes", { event: "*", schema: "public", table: "nodes",    filter: `repo=eq.${REPO_SLUG}` }, applyNodeChange)
      .on("postgres_changes", { event: "*", schema: "public", table: "branches", filter: `repo=eq.${REPO_SLUG}` }, applyBranchChange)
      .subscribe((status) => {
        if (status === "SUBSCRIBED") setStatus("live", "connected");
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setStatus("disconnected", "error");
        else setStatus(status.toLowerCase(), "connecting");
      });
  } catch (e) {
    console.error(e);
    setStatus("error: " + (e.message || e), "error");
  }
}

start();
</script>
</body>
</html>
